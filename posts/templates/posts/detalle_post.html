{% extends 'posts/base.html' %}

{% block content %}
    <h1>{{ post.titulo }}</h1>

    <p>Por {{ post.autor }} | {{ post.fecha_creacion|date:"d/m/Y H:i" }}</p>
    <p>Estado: {{ post.get_estado_display }}</p>

    {% if post.imagen %}
        <img src="{{ post.imagen.url }}"
             alt="{{ post.titulo }}"
             style="max-width: 100%; height: auto;">
    {% endif %}

    {{ post.contenido|linebreaks }}

    <p>
        <a href="{% url 'editar_post' post.pk %}">Editar</a>
        <a href="{% url 'eliminar_post' post.pk %}">Eliminar</a>
        <a href="{% url 'inicio' %}">Volver al inicio</a>
    </p>
{% endblock %}
